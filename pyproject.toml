[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsnip"
version = "0.1.3"
description = "Token-saving layer on top of Graphify: symbol-level code slicing, context packs, a savings ledger with an honest baseline, hooks and MCP for Claude Code, Copilot and Codex."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["graphify", "knowledge-graph", "tokens", "claude-code", "copilot", "codex", "mcp", "tree-sitter"]
dependencies = [
    "graphifyy>=0.9",
]

[project.optional-dependencies]
accurate = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
graphsnip = "graphsnip.cli:main"

[project.urls]
Repository = "https://github.com/naubadnithin7/codegraf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphsnip = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
